[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
lib_deps =
    bogde/HX711 @ ^0.7.5
    links2004/WebSockets @ ^2.4.1

; --- OTA SETTINGS ---
upload_protocol = espota
upload_port = 192.168.8.156
upload_flags = --auth=beantrack123
upload_timeout = 120